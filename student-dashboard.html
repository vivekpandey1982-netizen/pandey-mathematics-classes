
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Pandey Mathematics Classes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
            background: #f3f7fc;
            color: #102a56;
        }

        .section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        .resource {
            padding: 12px;
            margin: 10px 0;
            background: #f3f7fc;
            border-radius: 7px;
        }

        a {
            color: #183d73;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Pandey Mathematics Classes</h1>
    <h2>Student Learning Dashboard</h2>

    <p id="welcomeMessage">Checking your account...</p>

    <button id="logoutButton" hidden>Logout</button>

    <div id="learningArea" hidden>

        <div class="section">
            <h3>My Class Resources</h3>
            <p id="classHeading"></p>

            <h4>PDF Notes and Worksheets</h4>
            <div id="pdfResources"></div>

            <h4>Video Lessons</h4>
            <div id="videoResources"></div>
        </div>

        <div class="section">
            <h3>Common Learning Resources</h3>
            <div id="commonResources"></div>
        </div>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-iHtuA_hME0_uxezZij-_yeWPdi_kD04",
            authDomain: "pandey-mathematics-classes.firebaseapp.com",
            projectId: "pandey-mathematics-classes",
            storageBucket: "pandey-mathematics-classes.firebasestorage.app",
            messagingSenderId: "523762241856",
            appId: "1:523762241856:web:4402efc76a1f8463c66aa5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // CLASS-WISE STUDY MATERIALS

        const resourcesByClass = {

            "6": [],

            "7": [],

            "8": [],

            "9": [],

            "10": [
    {
        title: "Class 10 Mathematics Notes",
        type: "PDF",
        url: "https://drive.google.com/file/d/1zuwipiAzhSUWNoheyNWoKCqCLpNX191l/view?usp=drive_link"
    },
    {
        title: "Class 10 Mathematics Video Lesson",
        type: "Video",
        url: "https://www.youtube.com/watch?v=5wJSCcZgBJM&t=11s"
    }
],

            "11": [],

            "12": []

        };

        // COMMON RESOURCES FOR ALL APPROVED STUDENTS

        const commonResources = [];

        const welcomeMessage = document.getElementById("welcomeMessage");
        const learningArea = document.getElementById("learningArea");
        const logoutButton = document.getElementById("logoutButton");

        function displayResources(containerId, resources) {

            const container = document.getElementById(containerId);
            container.replaceChildren();

            if (!resources || resources.length === 0) {
                container.textContent = "Study materials will be added soon.";
                return;
            }

            resources.forEach(resource => {

                const item = document.createElement("div");
                item.className = "resource";

                const link = document.createElement("a");
                link.textContent = resource.title;
                link.href = resource.url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                const type = document.createElement("span");
                type.textContent = " (" + resource.type + ")";

                item.append(link, type);
                container.appendChild(item);

            });
        }

        // CHECK STUDENT LOGIN AND APPROVAL

        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.href = "student-login.html";
                return;
            }

            try {

                const studentRef = doc(db, "students", user.uid);
                const studentSnapshot = await getDoc(studentRef);

                if (!studentSnapshot.exists()) {
                    await signOut(auth);
                    window.location.href = "student-login.html";
                    return;
                }

                const student = studentSnapshot.data();

                if (student.status !== "approved") {
                    await signOut(auth);
                    window.location.href = "student-login.html";
                    return;
                }

                welcomeMessage.textContent =
                    "Welcome, " + student.name + "!";

                document.getElementById("classHeading").textContent =
                    "Your Class: " + student.class;

                const classResources =
                    resourcesByClass[String(student.class).trim()] || [];

                displayResources(
                    "pdfResources",
                    classResources.filter(r => r.type === "PDF")
                );

                displayResources(
                    "videoResources",
                    classResources.filter(r => r.type === "Video")
                );

                displayResources(
                    "commonResources",
                    commonResources
                );

                learningArea.hidden = false;
                logoutButton.hidden = false;

            } catch (error) {

                console.error(error);

                welcomeMessage.textContent =
                    "Unable to load your dashboard. Please try again.";

            }

        });

        // STUDENT LOGOUT

        logoutButton.addEventListener("click", async () => {

            await signOut(auth);
            window.location.href = "student-login.html";

        });

    </script>

</body>
</html>
