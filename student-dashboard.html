
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Pandey Mathematics Classes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
            background: #f3f7fc;
            color: #102a56;
        }

        .section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        .resource {
            padding: 12px;
            margin: 10px 0;
            background: #f3f7fc;
            border-radius: 7px;
            overflow-wrap: anywhere;
        }

        a {
            color: #183d73;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            background: #183d73;
            color: white;
            border: none;
            border-radius: 5px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <h1>Pandey Mathematics Classes</h1>
    <h2>Student Learning Dashboard</h2>

    <p id="welcomeMessage">Checking your account...</p>

    <button id="logoutButton" hidden>Logout</button>

    <div id="learningArea" hidden>

        <div class="section">

            <h3>My Class Resources</h3>

            <p id="classHeading"></p>

            <h4>PDF Notes and Worksheets</h4>
            <div id="pdfResources"></div>

            <h4>Video Lessons</h4>
            <div id="videoResources"></div>

        </div>

        <div class="section">

            <h3>Common Learning Resources</h3>
            <div id="commonResources"></div>

        </div>

    </div>


    <script type="module">

        // FIREBASE IMPORTS

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


        // FIREBASE CONFIGURATION

        const firebaseConfig = {
            apiKey: "AIzaSyB-iHtuA_hME0_uxezZij-_yeWPdi_kD04",
            authDomain: "pandey-mathematics-classes.firebaseapp.com",
            projectId: "pandey-mathematics-classes",
            storageBucket: "pandey-mathematics-classes.firebasestorage.app",
            messagingSenderId: "523762241856",
            appId: "1:523762241856:web:4402efc76a1f8463c66aa5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        // HTML ELEMENTS

        const welcomeMessage =
            document.getElementById("welcomeMessage");

        const learningArea =
            document.getElementById("learningArea");

        const logoutButton =
            document.getElementById("logoutButton");


        // DISPLAY RESOURCES

        function displayResources(containerId, resources) {

            const container = document.getElementById(containerId);

            container.replaceChildren();

            if (resources.length === 0) {

                container.textContent =
                    "Study materials will be added soon.";

                return;
            }

            resources.forEach(resource => {

                const item = document.createElement("div");
                item.className = "resource";

                const link = document.createElement("a");

                link.textContent =
                    resource.title || "Untitled Resource";

                link.href = resource.url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                const type = document.createElement("span");

                type.textContent =
                    " (" + (resource.type || "Resource") + ")";

                item.append(link, type);

                container.appendChild(item);

            });

        }


        // LOAD CLASS-SPECIFIC RESOURCES

        async function loadClassResources(studentClass) {

            const resourcesRef = collection(db, "resources");

            const classQuery = query(
                resourcesRef,
                where("targetClass", "==", studentClass)
            );

            const snapshot = await getDocs(classQuery);

            return snapshot.docs.map(resourceDoc => resourceDoc.data());

        }


        // LOAD COMMON RESOURCES

        async function loadCommonResources() {

            const resourcesRef = collection(db, "resources");

            const commonQuery = query(
                resourcesRef,
                where("targetClass", "==", "all")
            );

            const snapshot = await getDocs(commonQuery);

            return snapshot.docs.map(resourceDoc => resourceDoc.data());

        }


        // CHECK LOGIN AND STUDENT APPROVAL

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "student-login.html";

                return;
            }

            try {

                welcomeMessage.textContent =
                    "Checking student approval...";

                const studentRef = doc(db, "students", user.uid);

                const studentSnapshot = await getDoc(studentRef);

                if (!studentSnapshot.exists()) {

                    await signOut(auth);

                    window.location.href = "student-login.html";

                    return;
                }

                const student = studentSnapshot.data();

                if (student.status !== "approved") {

                    await signOut(auth);

                    window.location.href = "student-login.html";

                    return;
                }


                // DISPLAY STUDENT DETAILS

                welcomeMessage.textContent =
                    "Welcome, " + student.name + "!";

                const studentClass =
                    String(student.class).trim();

                document.getElementById("classHeading").textContent =
                    "Your Class: " + studentClass;


                // FETCH FIRESTORE RESOURCES

                welcomeMessage.textContent =
                    "Welcome, " + student.name +
                    "! Loading your study materials...";

                const [classResources, commonResources] =
                    await Promise.all([
                        loadClassResources(studentClass),
                        loadCommonResources()
                    ]);


                // SEPARATE PDF AND VIDEO RESOURCES

                displayResources(
                    "pdfResources",
                    classResources.filter(
                        resource => resource.type === "PDF"
                    )
                );

                displayResources(
                    "videoResources",
                    classResources.filter(
                        resource => resource.type === "Video"
                    )
                );

                displayResources(
                    "commonResources",
                    commonResources
                );


                // SHOW DASHBOARD

                learningArea.hidden = false;

                logoutButton.hidden = false;

                welcomeMessage.textContent =
                    "Welcome, " + student.name + "!";


            } catch (error) {

                console.error("Dashboard error:", error);

                welcomeMessage.textContent =
                    "Unable to load your dashboard. Please refresh and try again.";

            }

        });


        // STUDENT LOGOUT

        logoutButton.addEventListener("click", async () => {

            await signOut(auth);

            window.location.href = "student-login.html";

        });

    </script>

</body>
</html>
